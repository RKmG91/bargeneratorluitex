services:
  bargenerator:
    image: bargenerator:1.0.0
    pull_policy: never
    platform: linux/amd64
    ports:
      - "${ENDERECO_PUBLICACAO:-127.0.0.1}:${PORTA_PUBLICA:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
